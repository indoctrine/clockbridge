stages:
  - build
  - test
  - deploy
  - release

variables:
  DOCKER_HOST: tcp://$CI_DEPLOY_SERVER:2375/
  DOCKER_TLS_CERTDIR: ""
  # Tag image with commit SHA ref
  DOCKER_IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_BRANCH: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  CLOCKBRIDGE_CONFIG_DIR: /docker-data/clockbridge
  FF_SCRIPT_SECTIONS: 1

default:
  before_script:
    - docker info

docker-build:
  stage: build
  environment: development
  image: docker:stable
  services:
    - name: docker:stable-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    # Always build and push the SHA-tagged image
    - docker build --pull -t "$DOCKER_IMAGE_SHA" .
    - docker push "$DOCKER_IMAGE_SHA"
    # Also publish the branch-slug tag
    - >
      if [[ -z "$CI_COMMIT_TAG" ]]; then
        docker tag "$DOCKER_IMAGE_SHA" "$DOCKER_IMAGE_BRANCH"
        docker push "$DOCKER_IMAGE_BRANCH"
      fi
    # Tag pipelines: publish version and move latest tag
    # Major version tags (i.e. v1.2 points to the latest version of v1.2.x)
    - >
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        VERSION="${CI_COMMIT_TAG#v}"
        MAJOR="${VERSION%%.*}"
        MINOR="${VERSION%.*}"
        for T in "$VERSION" "$MINOR" "$MAJOR" latest; do
          docker tag "$DOCKER_IMAGE_SHA" "$CI_REGISTRY_IMAGE:$T"
          docker push "$CI_REGISTRY_IMAGE:$T"
        done
      fi
  rules:
    # Run only if committed to versioned tag or branch
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
      exists: [Dockerfile]
    - if: $CI_COMMIT_BRANCH
      exists: [Dockerfile]

test-code:
  stage: test
  image: python:3.12
  cache:
    paths:
      - .cache/pip
  before_script:
    - python3 -m pip install pytest
    - python3 -m pip install -r requirements.txt
    - export PYTHONPATH=$(pwd)
    - export CLOCKBRIDGE_CONFIG_PATH=tests/testConfig.yaml
  script:
    - pytest --junitxml tests/results.xml tests/

deploy-dev:
  stage: deploy
  environment: development
  image: docker:stable
  services:
    - name: docker:stable-dind
  needs: [docker-build, test-code]
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apk update && apk add curl
  script:
    # Deploy the commit tagged image we just created
    - docker pull "$DOCKER_IMAGE_SHA"
    - docker rm -f clockbridge || true
    - docker run -d -p 5000:5000 -v /docker-data/clockbridge:/config --restart always --name clockbridge "$DOCKER_IMAGE_SHA"
    - sleep 3
    - '[ "$(curl -q ${CI_DEPLOY_SERVER}:5000/ping)" = "Pong" ]'
  after_script:
    - docker rmi $(docker images -f dangling=true -f reference=$CI_REGISTRY_IMAGE -q)
  tags: [deploy]

deploy-prod:
  stage: deploy
  environment: production
  image: docker:stable
  services:
    - name: docker:stable-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  needs: [docker-build, test-code]
  before_script:
    - apk update && apk add curl
  script:
    # Trim the leading v from Git tag
    - VERSION="${CI_COMMIT_TAG#v}"
    - docker pull "$CI_REGISTRY_IMAGE:$VERSION"
    - docker rm -f clockbridge || true
    - docker run -d -p 5000:5000 -v $CLOCKBRIDGE_CONFIG_DIR:/config --restart always --name clockbridge "$CI_REGISTRY_IMAGE:$VERSION"
    - sleep 3
    - '[ "$(curl -q ${CI_DEPLOY_SERVER}:5000/ping)" = "Pong" ]'
  after_script:
    - docker rmi $(docker images -f dangling=true -f reference=$CI_REGISTRY_IMAGE -q)
  tags: [deploy]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  # Override Docker before_script on release
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
  needs: [deploy-prod]
  script:
    - echo "Publishing release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: $CI_COMMIT_TAG_MESSAGE